[project]
name = "ribr-ultrasound"
version = "0.1.0"
description = "Minimal RIBR code for ultrasound image segmentation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Deep Learning
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "torchmetrics>=1.0.0",
    "monai>=1.3.0",
    # Numerical Computing
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    # Image Processing
    "pillow>=9.5.0",
    # Utilities
    "tqdm>=4.65.0",
    "pandas>=3.0.1",
    "torchinfo>=1.8.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
